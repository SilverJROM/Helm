         reconsidering it, and re-enable additionally needs a fresh independent audit + JROM's approval.
      2. Commit 8024452 (convene-race fix) MUST SURVIVE — proven on run 32.
         `grep -c planMdPathForRaceGuard src/services/planning-phase-service.ts` must stay 3.
      3. Cycle 13 (memory_mcp "UI Upgrade") is JROM's live test cycle. Do not mutate its data or its
         canonical folder.
      4. No merge to main (SD10) — main is at 680b6ca and promote is JROM's call.
      5. app.js is hand-written browser ESM, 560KB, no build step: `node --check` after ANY edit, then
         `npm run build` (the tree ships two copies).
      6. UI proof targets :3110 via playwright.cap.config.ts. The default config (:3111, fake tmux,
         scratch DB) is NOT evidence.
      7. Run vitest FILE-BY-FILE. A bare full-suite run with extra pool flags hangs.
      8. NEVER weaken the AC28 provenance guard to make stale pre-AC28 fixtures pass.
         Known pre-existing failures, leave unless your change touches them: pause-after-planning-gate (3),
         finish-planning-production (1), b25-fix1-orphan-model (1), model-service (1), smoke (1).

  regression_gate: >
    AC23 is the anti-recurrence mechanism and is NOT optional. Every historical failure mode gets a
    token-free test: convene-before-artifacts; BROKEN->revise->CLEAN; partner1 CLEAN + partner2 BROKEN;
    partner-2 silent until timeout; legacy path refuses when north-star exists; ibrain row count
