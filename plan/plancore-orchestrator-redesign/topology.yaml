effort_planning_team:                        # JROM's three, xhigh. Authors THIS effort's plan.md.
  - { id: A, model: grok45,  launch: "grok --always-approve -m grok-4.5" }
  - { id: B, model: opus5,   launch: "claude --dangerously-skip-permissions --model claude-opus-5" }
  - { id: C, model: sol,     launch: "codex -m gpt-5.6-sol -c model_reasoning_effort=\"xhigh\" --dangerously-bypass-approvals-and-sandbox" }
  # grok45: CLI ceiling is `high`, not `xhigh` — runs at its max, recorded as a deviation, not written
  #   as xhigh and left untrue.
  # sol: PINNED xhigh — it silently defaults to `low` if unpinned.
  # opus5: xhigh at session level.

co_planners:                                 # Helm's own in-run co-planning pair (meta-level, see note above)
  - { id: A, model: opus5,   launch: "claude --dangerously-skip-permissions --model claude-opus-5" }
  - { id: B, model: sol,     launch: "codex -m gpt-5.6-sol -c model_reasoning_effort=\"xhigh\" --dangerously-bypass-approvals-and-sandbox" }

coordinator:
  primary: { engine: tiller, launch: "/home/agjrom/websites/wflow/tokenless_coord/shadow-harness/tiller --run-dir <run-dir>" }
  # Tiller is a deterministic Python drain loop (no model, no planning) — see TILLER-USAGE.md. It
  # dispatches implementer -> waits for commit -> dispatches independent validator -> fail-closed gate
  # on the verdict -> advances the queue. It structurally cannot park (no LLM turn to end).
  backup:  { model: codex55, launch: "codex -m gpt-5.5 --dangerously-bypass-approvals-and-sandbox" }
  # Backup is the ORIGINAL primary (codex55/projcore) — if Tiller's driver crashes or the format
  # contract proves unworkable mid-run, fall back to the proven path, not to grok45 (which is also
  # implementer L2 and must not coordinate its own work).

implementer:
  L1: { model: spark,   launch: "codex -m gpt-5.3-codex-spark --dangerously-bypass-approvals-and-sandbox" }
  L2: { model: grok45,  launch: "grok --always-approve -m grok-4.5" }
  L3: { model: sonnet5, launch: "claude --dangerously-skip-permissions --model claude-sonnet-5" }
  # `sol` and `opus5` NEVER implement (standing project rule).

validator:
  L1: { model: codex55, launch: "codex -m gpt-5.5 --dangerously-bypass-approvals-and-sandbox" }
  L2: { model: codex55, launch: "codex -m gpt-5.5 --dangerously-bypass-approvals-and-sandbox" }
  L3: { model: opus5,   launch: "claude --dangerously-skip-permissions --model claude-opus-5" }
  # verifier != fixer: implementers {spark, grok45, sonnet5} vs validators {codex55, opus5} — empty
  # intersection, holds at every tier.

deliberation_panel:                          # defaults
  convergence: strict-unanimous
  max_rounds: 3
  settle: [opus5, sol]
  panelists:
    - { model: codex55, profile: agj-panelist }
    - { model: sol,     profile: agj-panelist }
    - { model: grok45,  profile: agj-panelist }
    - { model: sonnet5, profile: agj-panelist }

redteam_panel:                               # defaults
  convergence: N-consecutive-clean
  N: 2
  tiers:
    budget:   { count: 3, models: [codex55, grok45, sonnet5] }
    standard: { count: 4, models: [codex55, sol, grok45, sonnet5] }
    elite:    { count: 4, models: [codex55, sol, grok45, sonnet5] }

